<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // the theme decides every colour, so set it before the first paint
      try {
        const asked = new URLSearchParams(location.search).get('theme');
        const t = ['classic', 'atelier', 'nocturne'].includes(asked) ? asked : localStorage.getItem('glossa-theme');
        document.documentElement.dataset.theme = ['classic', 'atelier', 'nocturne'].includes(t) ? t : 'nocturne';
      } catch {
        document.documentElement.dataset.theme = 'nocturne';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Terraverba · An atlas of the world’s languages</title>
    <meta name="description" content="An interactive globe, map and family tree of the world’s 8,000 languages — where they are spoken, how they are related, and the stories behind them." />
    <meta name="theme-color" content="#0a0e13" />
    <script>
      if (document.documentElement.dataset.theme === 'atelier') document.querySelector('meta[name=theme-color]').setAttribute('content', '#f3f2ee');
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Terraverba · An atlas of the world’s languages" />
    <meta property="og:description" content="More than seven thousand languages are spoken on Earth. Turn the globe and see where they live." />
    <meta property="og:image" content="og.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
